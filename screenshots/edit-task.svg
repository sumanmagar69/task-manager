<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Edit Task Dialog</title>
  <desc id="desc">A modal dialog for editing a task in the task manager.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#dde9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5d8bff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#536fc9" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="220" y="120" width="760" height="660" rx="30" fill="#ffffff"/>
  </g>
  <text x="600" y="200" text-anchor="middle" font-size="38" font-weight="700" fill="#1d2e4d" font-family="Segoe UI, Arial, sans-serif">Edit task</text>
  <rect x="290" y="250" width="620" height="72" rx="18" fill="#f5f8ff" stroke="#dfe9ff"/>
  <text x="325" y="294" font-size="22" fill="#7a8ab4" font-family="Segoe UI, Arial, sans-serif">Task title</text>
  <text x="325" y="335" font-size="28" font-weight="600" fill="#1f2d46" font-family="Segoe UI, Arial, sans-serif">Design landing page</text>

  <rect x="290" y="350" width="620" height="130" rx="18" fill="#f5f8ff" stroke="#dfe9ff"/>
  <text x="325" y="390" font-size="22" fill="#7a8ab4" font-family="Segoe UI, Arial, sans-serif">Description</text>
  <text x="325" y="436" font-size="24" fill="#243757" font-family="Segoe UI, Arial, sans-serif">Finalize the landing page layout and</text>
  <text x="325" y="465" font-size="24" fill="#243757" font-family="Segoe UI, Arial, sans-serif">prepare the launch checklist.</text>

  <rect x="290" y="510" width="300" height="72" rx="18" fill="#f5f8ff" stroke="#dfe9ff"/>
  <text x="325" y="555" font-size="22" fill="#7a8ab4" font-family="Segoe UI, Arial, sans-serif">Due date</text>
  <text x="325" y="585" font-size="24" fill="#243757" font-family="Segoe UI, Arial, sans-serif">2026-09-18</text>

  <g>
    <rect x="610" y="510" width="300" height="72" rx="18" fill="#f5f8ff" stroke="#dfe9ff"/>
    <text x="646" y="555" font-size="22" fill="#7a8ab4" font-family="Segoe UI, Arial, sans-serif">Priority</text>
    <text x="646" y="585" font-size="24" fill="#243757" font-family="Segoe UI, Arial, sans-serif">High priority</text>
  </g>

  <rect x="490" y="650" width="150" height="56" rx="18" fill="#ffffff" stroke="#dfe9ff"/>
  <text x="565" y="686" text-anchor="middle" font-size="22" fill="#4d628d" font-family="Segoe UI, Arial, sans-serif">Cancel</text>

  <rect x="660" y="650" width="170" height="56" rx="18" fill="url(#accent)"/>
  <text x="745" y="686" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Save</text>
</svg>
