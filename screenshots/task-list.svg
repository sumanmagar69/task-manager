<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Task List Screen</title>
  <desc id="desc">A task manager list view with tasks and add button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#edf5ff"/>
      <stop offset="100%" stop-color="#e4ebff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5d8bff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#526fca" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="130" y="70" width="960" height="760" rx="32" fill="#ffffff"/>
  </g>
  <rect x="170" y="110" width="260" height="680" rx="24" fill="#f9faff" stroke="#dfe9ff"/>
  <circle cx="300" cy="180" r="46" fill="url(#accent)"/>
  <text x="300" y="195" text-anchor="middle" font-size="38" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">T</text>
  <text x="300" y="270" text-anchor="middle" font-size="28" font-weight="700" fill="#1e2945" font-family="Segoe UI, Arial, sans-serif">TaskFlow</text>
  <rect x="210" y="330" width="180" height="52" rx="16" fill="#edf3ff"/>
  <text x="250" y="363" font-size="22" fill="#5873b7" font-family="Segoe UI, Arial, sans-serif">Overview</text>
  <rect x="210" y="400" width="180" height="52" rx="16" fill="#ffffff" stroke="#dfe9ff"/>
  <text x="250" y="433" font-size="22" fill="#384766" font-family="Segoe UI, Arial, sans-serif">Tasks</text>
  <rect x="210" y="470" width="180" height="52" rx="16" fill="#ffffff" stroke="#dfe9ff"/>
  <text x="250" y="503" font-size="22" fill="#384766" font-family="Segoe UI, Arial, sans-serif">Calendar</text>
  <rect x="210" y="650" width="180" height="60" rx="18" fill="url(#accent)"/>
  <text x="300" y="690" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Sign out</text>

  <rect x="490" y="120" width="520" height="640" rx="26" fill="#ffffff" stroke="#dde9ff"/>
  <text x="530" y="180" font-size="34" font-weight="700" fill="#1f2b45" font-family="Segoe UI, Arial, sans-serif">My Tasks</text>
  <rect x="530" y="210" width="170" height="48" rx="16" fill="#edf3ff"/>
  <text x="570" y="243" font-size="20" font-weight="700" fill="#6077b6" font-family="Segoe UI, Arial, sans-serif">All Tasks</text>
  <rect x="720" y="210" width="230" height="48" rx="16" fill="#ffffff" stroke="#dfe9ff"/>
  <text x="767" y="243" font-size="20" fill="#536b9d" font-family="Segoe UI, Arial, sans-serif">Due today</text>

  <g>
    <rect x="520" y="290" width="440" height="90" rx="18" fill="#f8fbff" stroke="#e3edff"/>
    <rect x="540" y="318" width="22" height="22" rx="6" fill="#62d59d"/>
    <text x="580" y="336" font-size="24" font-weight="600" fill="#1d2943" font-family="Segoe UI, Arial, sans-serif">Design landing page</text>
    <text x="580" y="360" font-size="18" fill="#6d7ea8" font-family="Segoe UI, Arial, sans-serif">High priority • 9:00 AM</text>
  </g>

  <g>
    <rect x="520" y="398" width="440" height="90" rx="18" fill="#ffffff" stroke="#e3edff"/>
    <rect x="540" y="426" width="22" height="22" rx="6" fill="#ffffff" stroke="#a3b6eb" stroke-width="3"/>
    <text x="580" y="444" font-size="24" font-weight="600" fill="#1d2943" font-family="Segoe UI, Arial, sans-serif">Create Firebase config</text>
    <text x="580" y="468" font-size="18" fill="#6d7ea8" font-family="Segoe UI, Arial, sans-serif">In progress • 11:30 AM</text>
  </g>

  <g>
    <rect x="520" y="506" width="440" height="90" rx="18" fill="#ffffff" stroke="#e3edff"/>
    <rect x="540" y="534" width="22" height="22" rx="6" fill="#62d59d"/>
    <text x="580" y="552" font-size="24" font-weight="600" fill="#1d2943" font-family="Segoe UI, Arial, sans-serif">Review API contract</text>
    <text x="580" y="576" font-size="18" fill="#6d7ea8" font-family="Segoe UI, Arial, sans-serif">Completed • 2:00 PM</text>
  </g>

  <rect x="820" y="640" width="130" height="52" rx="16" fill="url(#accent)"/>
  <text x="885" y="673" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Add task</text>
</svg>
