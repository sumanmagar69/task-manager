<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sign In Screen</title>
  <desc id="desc">A sign in screen for the task manager app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5d8bff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4d6cc9" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="312" y="110" width="576" height="680" rx="32" fill="#ffffff"/>
  </g>
  <circle cx="600" cy="230" r="62" fill="url(#accent)"/>
  <text x="600" y="250" text-anchor="middle" font-size="56" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">T</text>
  <text x="600" y="330" text-anchor="middle" font-size="38" font-weight="700" fill="#1a243d" font-family="Segoe UI, Arial, sans-serif">Welcome back</text>
  <text x="600" y="371" text-anchor="middle" font-size="20" fill="#667ca3" font-family="Segoe UI, Arial, sans-serif">Sign in to continue to your tasks</text>
  <rect x="400" y="430" width="400" height="64" rx="16" fill="#f4f7ff" stroke="#dfe9ff"/>
  <text x="432" y="468" font-size="22" fill="#7c8db7" font-family="Segoe UI, Arial, sans-serif">Email address</text>
  <rect x="400" y="520" width="400" height="64" rx="16" fill="#f4f7ff" stroke="#dfe9ff"/>
  <text x="432" y="558" font-size="22" fill="#7c8db7" font-family="Segoe UI, Arial, sans-serif">Password</text>
  <rect x="400" y="610" width="400" height="62" rx="18" fill="url(#accent)"/>
  <text x="600" y="650" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Sign In</text>
  <text x="600" y="700" text-anchor="middle" font-size="18" fill="#7386ae" font-family="Segoe UI, Arial, sans-serif">Need an account? Create one</text>
</svg>
