<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Task Manager App Preview</title>
  <desc id="desc">A stylized Flutter task manager dashboard with a login panel and task list preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5274d4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="70" width="960" height="760" rx="34" fill="url(#card)"/>
  </g>

  <rect x="160" y="110" width="250" height="680" rx="30" fill="#f8faff" stroke="#dfe7ff"/>
  <circle cx="285" cy="180" r="52" fill="url(#accent)"/>
  <text x="285" y="190" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">T</text>
  <text x="285" y="278" text-anchor="middle" font-size="30" font-weight="700" fill="#1a233a" font-family="Segoe UI, Arial, sans-serif">TaskFlow</text>

  <rect x="200" y="334" width="170" height="46" rx="15" fill="#edf3ff"/>
  <text x="238" y="364" font-size="22" font-weight="600" fill="#5166a8" font-family="Segoe UI, Arial, sans-serif">Overview</text>

  <rect x="200" y="395" width="170" height="46" rx="15" fill="#ffffff" stroke="#dde8ff"/>
  <text x="238" y="425" font-size="22" fill="#3a496c" font-family="Segoe UI, Arial, sans-serif">Tasks</text>

  <rect x="200" y="456" width="170" height="46" rx="15" fill="#ffffff" stroke="#dde8ff"/>
  <text x="238" y="486" font-size="22" fill="#3a496c" font-family="Segoe UI, Arial, sans-serif">Calendar</text>

  <rect x="200" y="517" width="170" height="46" rx="15" fill="#ffffff" stroke="#dde8ff"/>
  <text x="238" y="547" font-size="22" fill="#3a496c" font-family="Segoe UI, Arial, sans-serif">Settings</text>

  <rect x="200" y="650" width="170" height="56" rx="18" fill="url(#accent)"/>
  <text x="285" y="687" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Sign out</text>

  <rect x="470" y="120" width="540" height="640" rx="28" fill="#ffffff" stroke="#dfe9ff"/>

  <text x="520" y="185" font-size="36" font-weight="700" fill="#1f2f4d" font-family="Segoe UI, Arial, sans-serif">My Tasks</text>
  <rect x="520" y="210" width="190" height="52" rx="16" fill="#eef4ff"/>
  <text x="562" y="244" font-size="20" font-weight="700" fill="#6880be" font-family="Segoe UI, Arial, sans-serif">All Tasks</text>
  <rect x="728" y="210" width="220" height="52" rx="16" fill="#ffffff" stroke="#dfe9ff"/>
  <text x="785" y="244" font-size="20" fill="#546a9d" font-family="Segoe UI, Arial, sans-serif">Due today</text>

  <g>
    <rect x="510" y="290" width="460" height="94" rx="18" fill="#f9fbff" stroke="#e1ebff"/>
    <rect x="530" y="318" width="24" height="24" rx="6" fill="#62d59d"/>
    <text x="575" y="337" font-size="25" font-weight="600" fill="#1d2c45" font-family="Segoe UI, Arial, sans-serif">Design landing page</text>
    <text x="575" y="360" font-size="18" fill="#6a7ea4" font-family="Segoe UI, Arial, sans-serif">High priority • 9:00 AM</text>
    <circle cx="928" cy="336" r="12" fill="#dfe9ff"/>
    <path d="M922 336h12M928 330v12" stroke="#6d81c9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="510" y="402" width="460" height="94" rx="18" fill="#ffffff" stroke="#e0ebff"/>
    <rect x="530" y="430" width="24" height="24" rx="6" fill="#ffffff" stroke="#9ab0e9" stroke-width="3"/>
    <text x="575" y="449" font-size="25" font-weight="600" fill="#1d2c45" font-family="Segoe UI, Arial, sans-serif">Create Firebase config</text>
    <text x="575" y="472" font-size="18" fill="#6a7ea4" font-family="Segoe UI, Arial, sans-serif">In progress • 11:30 AM</text>
    <circle cx="928" cy="448" r="12" fill="#dfe9ff"/>
    <path d="M922 448h12M928 442v12" stroke="#6d81c9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="510" y="514" width="460" height="94" rx="18" fill="#ffffff" stroke="#e0ebff"/>
    <rect x="530" y="542" width="24" height="24" rx="6" fill="#62d59d"/>
    <text x="575" y="561" font-size="25" font-weight="600" fill="#1d2c45" font-family="Segoe UI, Arial, sans-serif">Review API contract</text>
    <text x="575" y="584" font-size="18" fill="#6a7ea4" font-family="Segoe UI, Arial, sans-serif">Completed • 2:00 PM</text>
    <circle cx="928" cy="560" r="12" fill="#dfe9ff"/>
    <path d="M922 560h12M928 554v12" stroke="#6d81c9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect x="845" y="620" width="120" height="48" rx="16" fill="url(#accent)"/>
  <text x="905" y="652" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Add task</text>
</svg>
